name: CI/CD Pipeline to AWS EKS

on:
  push:
    branches: ["release/*"]

env:
  AWS_REGION: us-east-1                   
  ECR_REPOSITORY: artsoft/top-car-service
  EKS_CLUSTER_NAME: top-car-service-eks-cluster

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/checkout@v4    
      - name: Build the Docker image
        run: mvn -B package --file app/pom.xml          
      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
          # Update image and deploy (using envsubst or sed to set image tag)
          kubectl set image deployment/top-car-service-deployment application=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          kubectl rollout status deployment/top-car-service-deployment
