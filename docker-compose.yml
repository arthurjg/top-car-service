version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: top-car-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: top-car-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d top-car-db || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    name: top_car_postgres_data
