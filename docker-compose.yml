version: '3.8'

networks:
  local:

services:
  db-top-car-postgres:
    image: postgres:15-alpine
    container_name: db-top-car-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: top-car-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d top-car-db || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - local
      
  app-top-car-service-core-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENV: dev
    image: top-car-service:1.2.1
    container_name: app-core-api
    restart: unless-stopped
    ports:
      - "8082:8082"    
    depends_on:
      - db-top-car-postgres
    networks:
      - local
    environment:
      - ENV=dev

volumes:
  postgres_data:
    name: top_car_postgres_data
